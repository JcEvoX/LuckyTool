name: CI

# 任意分支 push 或 PR 时触发：编译 debug 产物并上传，用于验证可构建性。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 工程用 jvmToolchain(21)（见 app/build.gradle.kts），与本地/发布保持一致。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # compileSdk = 37（见 build.gradle.kts），稳定通道可能尚未收录，回退到预览通道。
      # build-tools 交给 AGP 按需自动下载，避免写死版本号。
      - name: Install Android platform
        run: |
          sdkmanager --install "platforms;android-37" \
            || sdkmanager --install --channel=3 "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 根 build.gradle.kts 在配置阶段无条件加载 keystore/keystore.properties，
      # 缺失会直接构建失败。未配置正式密钥时用一次性 keytool 密钥兜底。
      - name: Provide signing keystore
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "$ANDROID_SIGNING_KEY" ]; then
            echo "$ANDROID_SIGNING_KEY" | base64 -d > keystore/ci.jks
            STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"; ALIAS="$ANDROID_KEY_ALIAS"; KEY_PASS="$ANDROID_KEY_PASSWORD"
          else
            keytool -genkeypair -v -keystore keystore/ci.jks \
              -storepass android -keypass android -alias luckyci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=LuckyTool CI, OU=CI, O=JcEvoX, L=Unknown, ST=Unknown, C=CN"
            STORE_PASS=android; ALIAS=luckyci; KEY_PASS=android
          fi
          cat > keystore/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/keystore/ci.jks
          storePassword=$STORE_PASS
          keyAlias=$ALIAS
          keyPassword=$KEY_PASS
          EOF

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyTool-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error